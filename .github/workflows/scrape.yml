name: On-demand competitor scrape

on:
  push:
    paths:
      - 'request.json'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r xiaoxiao-Fetches-Warehouse-V2/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build scraper event payload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          req = json.loads(Path('request.json').read_text(encoding='utf-8'))
          payload = {'targets': req['targets']}
          body = '```json\n' + json.dumps(payload, ensure_ascii=False, indent=2) + '\n```'
          Path('synthetic_event.json').write_text(
              json.dumps({'issue': {'body': body}}, ensure_ascii=False),
              encoding='utf-8'
          )
          PY

      - name: Apply runtime safety patch
        run: |
          python runtime_patch.py

      - name: Run verifier
        id: scrape
        continue-on-error: true
        run: |
          SCRAPER_EVENT_PATH="${{ github.workspace }}/synthetic_event.json" \
            python xiaoxiao-Fetches-Warehouse-V2/scraper/scrape.py > reports_console.txt 2>&1

      - name: Enforce redirect safety and rebuild report
        if: always()
        run: |
          if [ -f reports/result.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          p = Path('reports/result.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          rows = data.get('results', [])

          for r in rows:
              req_path = urlparse(r.get('requested_url','')).path.rstrip('/')
              final_path = urlparse(r.get('final_url','')).path.rstrip('/')
              if req_path and final_path and req_path != final_path:
                  r['status'] = 'REDIRECTED_OTHER_PRODUCT'
                  r['current_price'] = ''
                  r['original_price'] = ''
                  r['stock'] = ''
                  r['method'] = ''
                  r['reason'] = 'Requested product URL redirected to a different product path. No requested-product price reported.'

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')

          out = [
              '## Scrape result','',
              '| Region | Product | Variant | Current price | Original price | Stock | Status |',
              '|---|---|---|---:|---:|---|---|'
          ]
          for r in rows:
              out.append(
                  f"| {r.get('region') or '-'} | {r.get('requested_product') or '-'} | {r.get('requested_variant') or '-'} | "
                  f"{r.get('current_price') or '**—**'} | {r.get('original_price') or '—'} | {r.get('stock') or '—'} | **{r.get('status') or 'UNVERIFIED'}** |"
              )
          out += ['', '### Verification details', '']
          for r in rows:
              out += [
                  f"**{r.get('region') or '-'} — {r.get('requested_variant') or r.get('requested_product') or '-'}**",
                  f"- Requested URL: {r.get('requested_url') or '—'}",
                  f"- Final URL: {r.get('final_url') or '—'}",
                  f"- Method: {r.get('method') or '—'}",
                  f"- Reason: {r.get('reason') or '—'}"
              ]
              if r.get('evidence'):
                  out.append(f"- Evidence: `{r.get('evidence')[:800]}`")
              if r.get('promotion'):
                  out.append(f"- Promotion text: {r.get('promotion')[:800]}")
              out.append('')
          out += ['---', '**Hard rule:** anything not `VERIFIED` gets no guessed/backfilled price.']
          Path('reports/result.md').write_text('\n'.join(out), encoding='utf-8')
          PY
          fi

      - name: Ensure failure report exists
        if: always()
        run: |
          mkdir -p reports
          if [ ! -f reports/result.md ]; then
            {
              echo "## Scrape failed"
              echo
              echo "The browser job did not produce a verified result. No price has been reported."
              echo
              echo '```'
              tail -n 120 reports_console.txt || true
              echo '```'
            } > reports/result.md
          fi
          echo >> reports/result.md
          echo "Run ID: ${{ github.run_id }}" >> reports/result.md

      - name: Comment result back to request issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_NUMBER=$(python -c "import json; print(json.load(open('request.json'))['issue_number'])")
          gh issue comment "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --body-file reports/result.md

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-evidence-${{ github.run_id }}
          path: |
            reports/
            reports_console.txt
            request.json
          if-no-files-found: warn
          retention-days: 30
