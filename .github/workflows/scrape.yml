name: On-demand competitor scrape

on:
  push:
    paths:
      - 'request.json'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -r xiaoxiao-Fetches-Warehouse-V2/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build scraper event payload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          req = json.loads(Path('request.json').read_text(encoding='utf-8'))
          payload = {'targets': req['targets']}
          body = '```json\n' + json.dumps(payload, ensure_ascii=False, indent=2) + '\n```'
          Path('synthetic_event.json').write_text(
              json.dumps({'issue': {'body': body}}, ensure_ascii=False),
              encoding='utf-8'
          )
          PY

      - name: Run verifier
        id: scrape
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: ${{ github.workspace }}/synthetic_event.json
        run: |
          python xiaoxiao-Fetches-Warehouse-V2/scraper/scrape.py > reports_console.txt 2>&1

      - name: Ensure failure report exists
        if: always()
        run: |
          mkdir -p reports
          if [ ! -f reports/result.md ]; then
            {
              echo "## Scrape failed"
              echo
              echo "The browser job did not produce a verified result. No price has been reported."
              echo
              echo '```'
              tail -n 120 reports_console.txt || true
              echo '```'
            } > reports/result.md
          fi

      - name: Comment result back to request issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_NUMBER=$(python -c "import json; print(json.load(open('request.json'))['issue_number'])")
          gh issue comment "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --body-file reports/result.md

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-evidence-${{ github.run_id }}
          path: |
            reports/
            reports_console.txt
            request.json
          if-no-files-found: warn
          retention-days: 30
